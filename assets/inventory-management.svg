<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Small store inventory overview</title>
  <desc id="desc">Illustration of the Python program's inventory: five products, 125 units, total value of 84 dollars and 50 cents, and restock alerts for grapes and mango.</desc>
  <rect width="720" height="480" fill="#263342"/>
  <rect x="28" y="24" width="664" height="432" rx="18" fill="#18212D" stroke="#415064"/>
  <g font-family="Arial, sans-serif">
    <text x="54" y="63" fill="#F8FAFC" font-size="23" font-weight="700">Store inventory</text>
    <text x="666" y="61" text-anchor="end" fill="#9AAABC" font-size="12">PROGRAM VISUALIZATION</text>
    <rect x="52" y="84" width="192" height="72" rx="9" fill="#263342"/>
    <rect x="264" y="84" width="192" height="72" rx="9" fill="#263342"/>
    <rect x="476" y="84" width="192" height="72" rx="9" fill="#263342"/>
    <g fill="#ABB9C9" font-size="12"><text x="68" y="106">PRODUCTS</text><text x="280" y="106">UNITS IN STOCK</text><text x="492" y="106">TOTAL VALUE</text></g>
    <g fill="#F8FAFC" font-size="28" font-weight="700"><text x="68" y="140">5</text><text x="280" y="140">125</text><text x="492" y="140" fill="#F59E0B">$84.50</text></g>
    <g fill="#9AAABC" font-size="12" font-weight="700"><text x="56" y="190">PRODUCT</text><text x="260" y="190">STOCK</text><text x="440" y="190">PRICE</text><text x="552" y="190">STATUS</text></g>
    <path d="M52 202H668 M52 240H668 M52 278H668 M52 316H668 M52 354H668 M52 392H668" stroke="#334154"/>
    <g fill="#F8FAFC" font-size="16"><text x="56" y="227">Apple</text><text x="56" y="265">Banana</text><text x="56" y="303">Orange</text><text x="56" y="341">Grapes</text><text x="56" y="379">Mango</text></g>
    <g fill="#CFD8E3" font-size="15"><text x="260" y="227">50</text><text x="260" y="265">20</text><text x="260" y="303">30</text><text x="260" y="341">15</text><text x="260" y="379">10</text><text x="440" y="227">$0.50</text><text x="440" y="265">$0.30</text><text x="440" y="303">$0.70</text><text x="440" y="341">$1.50</text><text x="440" y="379">$2.00</text></g>
    <g fill="#7DD3B0" font-size="13"><text x="552" y="227">In stock</text><text x="552" y="265">In stock</text><text x="552" y="303">In stock</text></g>
    <g fill="#F59E0B" font-size="13"><text x="552" y="341">Restock</text><text x="552" y="379">Restock</text></g>
    <circle cx="61" cy="423" r="5" fill="#F59E0B"/>
    <text x="76" y="428" fill="#CFD8E3" font-size="13">Price update: Mango $2.00 → $2.20</text>
  </g>
</svg>
